name: 09C Standalone Build Gate

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'frontend/**'
      - 'packages/**'
      - 'scripts/verify-standalone-apps.js'
      - 'scripts/verify-09c-post-extraction-integrity.js'
      - 'scripts/verify-09d-dependency-decoupling.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/standalone-build-gate.yml'
  workflow_dispatch:

jobs:
  standalone-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Verify post-extraction integrity
        run: npm run verify:09c-post-extraction

      - name: Verify 09D dependency decoupling
        run: npm run verify:09d-dependencies

      - name: Build apps/web standalone
        run: npm --prefix apps/web run build

      - name: Build apps/admin standalone
        run: npm --prefix apps/admin run build

      - name: Verify API runtime syntax
        run: node --check apps/api/server.js

      - name: Verify API contracts
        run: npm run verify:api-contracts

      - name: Verify standalone apps
        run: npm run verify:standalone-apps
