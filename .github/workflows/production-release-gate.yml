name: Production Release Gate

on:
  workflow_dispatch:

concurrency:
  group: trexio-production-release
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.TREXIO_PRODUCTION_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify structural readiness
        run: node scripts/verify-production-readiness.js
      - name: Verify production attestation and live smoke
        env:
          TREXIO_PRODUCTION_BASE_URL: ${{ vars.TREXIO_PRODUCTION_BASE_URL }}
          TREXIO_PRODUCTION_ATTESTATION: ${{ secrets.TREXIO_PRODUCTION_ATTESTATION }}
        run: node scripts/verify-production-release-attestation.js
      - name: Publish production release evidence
        uses: actions/upload-artifact@v4
        with:
          name: trexio-production-release-gate
          path: data/production-release-gate.json
