name: Mission 07 - Relational DB Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relational-verification:
    name: Verify Vendor & Trip Relational Cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify relational cutover
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:verify-relational-cutover

      - name: Verify repository integrity
        run: npm run verify-integrity

      - name: Security scan
        run: npm run security-scan
