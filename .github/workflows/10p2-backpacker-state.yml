name: Trexio 10P.2 Backpacker State Gate

on:
  push:
    branches:
      - mission/10p-real-data-architecture-hardening
  pull_request:
    branches:
      - main
      - mission/10p-real-data-architecture-hardening
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify 10P.2 Backpacker state
        run: npm run verify:10p2-backpacker-state
      - name: Verify 10P.2 full server state
        run: node scripts/verify-10p2-global-business-state.js
      - name: Syntax check server runtime
        run: node --check apps/api/server.js && node --check apps/api/modules/runtime/businessState.js
