name: Trexio 10P.8 Provider Configuration Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [mission/10p-real-data-architecture-hardening]

jobs:
  provider-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run 10P.8 fail-closed provider configuration verifier
        run: node scripts/verify-10p8-provider-configuration.js
