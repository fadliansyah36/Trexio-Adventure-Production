name: Trexio 10P.9 Tenant RBAC Domain Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [mission/10p-real-data-architecture-hardening]

jobs:
  tenant-rbac-domain-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run 10P.9 tenant RBAC domain coverage verifier
        run: node scripts/verify-10p9-tenant-rbac-domain-coverage.js
