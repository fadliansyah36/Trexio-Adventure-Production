name: Mission 07 - Apply Relational Cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: Apply Vendor & Trip Relational Migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply Mission 07 migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/apply-mission-07-relational-cutover.js
