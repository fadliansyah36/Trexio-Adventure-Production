name: Trexio 10P.5 Service Repository Gate

on:
  push:
    branches:
      - mission/10p-real-data-architecture-hardening
  workflow_dispatch:

jobs:
  verify-10p5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify JavaScript syntax
        run: |
          node --check apps/api/modules/services/marketplaceService.js
          node --check apps/api/modules/routes/marketplace.js
          node --check apps/api/server.js
          node --check scripts/verify-10p5-service-repository.js

      - name: Verify service repository boundary
        run: node scripts/verify-10p5-service-repository.js
