name: PWA Build Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pwa-build-verification:
    name: Trexio PWA Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm install
        run: npm install

      - name: Repository integrity verification
        run: npm run verify-integrity

      - name: Security scan
        run: npm run security-scan

      - name: PWA production build
        run: npm run build

      - name: Verify PWA production output
        run: |
          test -f apps/web/build/index.html
          test -d apps/web/build/static
          echo "PWA production output verified"

      - name: PWA BUILD VERIFIED
        run: echo "TREXIO PWA BUILD VERIFIED"
