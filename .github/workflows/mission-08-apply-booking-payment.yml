name: Mission 08 - Apply Booking Payment Cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: Apply Booking & Payment Relational Migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Apply Mission 08 migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:apply-mission-08-booking-payment
