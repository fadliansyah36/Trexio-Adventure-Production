name: 09E-09F Runtime and PWA Verification

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/admin/**"
      - "packages/**"
      - "scripts/verify-09c-post-extraction-integrity.js"
      - "scripts/verify-09e-09f-pwa-runtime.js"
      - ".github/workflows/09e-09f-runtime-pwa.yml"
      - "package.json"
      - "eslint.config.mjs"
      - "scripts/security-scan.js"
      - "scripts/verify-repo-integrity.js"
      - "scripts/verify-production-readiness.js"
      - "scripts/reconcile-09c-09d-evidence.js"
  workflow_dispatch:

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-09c-post-extraction-integrity.js
      - run: node scripts/verify-09e-09f-pwa-runtime.js
      - run: node scripts/verify-api-contracts.js
      - run: node scripts/verify-09d-dependency-decoupling.js
      - run: node scripts/verify-production-readiness.js
      - run: node scripts/reconcile-09c-09d-evidence.js

  lint:
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  security:
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run verify-integrity
      - run: npm run security-scan

  api-runtime:
    needs: [structural, lint, security]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: API runtime smoke
        shell: bash
        env:
          NODE_ENV: test
          PORT: 3100
          JWT_SECRET: 09e_runtime_verification_secret_01234567890123456789
          SEED_ADMIN_PASSWORD: 09e_runtime_test_password_0123456789
        run: |
          node server.js > /tmp/trexio-api.log 2>&1 &
          PID=$!
          trap 'if kill -0 "$PID" 2>/dev/null; then kill "$PID"; fi' EXIT
          for i in {1..30}; do
            if curl --max-time 3 -sS -o /tmp/api-response.json -w "%{http_code}" http://127.0.0.1:3100/api/does-not-exist > /tmp/api-status.txt 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo '--- API SERVER LOG ---'
          cat /tmp/trexio-api.log || true
          echo '--- API RESPONSE ---'
          if [ -f /tmp/api-response.json ]; then cat /tmp/api-response.json; fi
          echo '--- API STATUS ---'
          if [ -f /tmp/api-status.txt ]; then cat /tmp/api-status.txt; fi
          test -s /tmp/api-response.json
          test "$(cat /tmp/api-status.txt)" = "404"
          node -e "const r=require('/tmp/api-response.json'); if(r.code!=='API_NOT_FOUND') process.exit(1)"
          if kill -0 "$PID" 2>/dev/null; then kill "$PID"; fi

  web:
    needs: [structural, lint, security]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify web build output
        run: |
          test -d "$GITHUB_WORKSPACE/apps/web/build"
          test -s "$GITHUB_WORKSPACE/apps/web/build/index.html"
          test ! -e "$GITHUB_WORKSPACE/frontend/build/index.html"

  admin:
    needs: [structural, lint, security]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify admin build output
        run: |
          test -d "$GITHUB_WORKSPACE/apps/admin/build"
          test -s "$GITHUB_WORKSPACE/apps/admin/build/index.html"


  release-candidate:
    needs: [api-runtime, web, admin, lint, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-production-readiness.js
      - name: Publish readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: trexio-production-readiness
          path: |
            data/production-readiness-structural.json
            data/09c-09d-evidence-reconciliation.json
