name: Trexio 10P.7 Mock Fake Simulation Cleanup Gate

on:
  push:
    branches:
      - mission/10p-real-data-architecture-hardening
  pull_request:
    branches:
      - main

jobs:
  mock-fake-simulation-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-10p7-mock-fake-simulation.js
