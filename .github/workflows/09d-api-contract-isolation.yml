name: 09D API Contract Isolation

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/admin/**"
      - "packages/**"
      - "scripts/verify-api-contracts.js"
      - "scripts/verify-09d-dependency-decoupling.js"
      - ".github/workflows/09d-api-contract-isolation.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/admin/**"
      - "packages/**"
      - "scripts/verify-api-contracts.js"
      - "scripts/verify-09d-dependency-decoupling.js"
      - ".github/workflows/09d-api-contract-isolation.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify API contract boundaries
        run: node scripts/verify-api-contracts.js
      - name: Verify dependency decoupling
        run: node scripts/verify-09d-dependency-decoupling.js
      - name: Verify API module graph
        run: node scripts/verify-api-module-graph.js

  standalone-builds:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, admin]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
